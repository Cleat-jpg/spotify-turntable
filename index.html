<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turntable</title>
<style>
:root{--bg:#17130f;--fg:#f3ece0;--mut:#a39a8a;--card:#241e17;--line:#3a3025;--acc:#1db954;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
#bgc{position:fixed;inset:0;background-size:cover;background-position:center;filter:blur(70px) saturate(1.4);opacity:.35;transform:scale(1.3);transition:background-image .6s}
main{position:relative;max-width:520px;margin:0 auto;padding:22px 18px 40px;display:flex;flex-direction:column;gap:18px;align-items:center}
h2{margin:0;font-size:1.1rem}
.card{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card p{margin:0 0 10px;color:var(--mut);font-size:.88rem;line-height:1.5}
code{background:#0006;padding:2px 6px;border-radius:5px;font-size:.8rem;word-break:break-all}
input[type=text]{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0005;color:var(--fg);margin:6px 0 10px}
button{font:inherit;color:var(--fg);cursor:pointer}
.btn{background:var(--acc);color:#04210f;border:0;border-radius:999px;padding:10px 18px;font-weight:700}
.ghost{background:#0004;border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:.85rem}
.hide{display:none!important}
/* deck */
.deck{position:relative;width:100%;max-width:440px;aspect-ratio:1.12;background:linear-gradient(145deg,#3b2c1d,#241a11);border-radius:18px;border:1px solid #5a4630;box-shadow:0 24px 50px #0008}
.deck.over{outline:3px dashed var(--acc)}
.platter{position:absolute;left:5%;top:7%;width:74%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#555,#222);box-shadow:inset 0 0 0 6px #111,0 6px 18px #0009;display:grid;place-items:center;cursor:pointer}
.rec{width:94%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#222 0 17%,transparent 17.5%),repeating-radial-gradient(circle,#0b0b0b 0 2px,#171717 2px 4px);opacity:0;transform:translateY(-40px) scale(1.1);transition:opacity .4s,transform .5s cubic-bezier(.2,.8,.2,1);position:relative}
.rec.in{opacity:1;transform:none}
.rec i{width:36%;aspect-ratio:1;border-radius:50%;background-size:cover;background-position:center}
.rec::after{content:"";position:absolute;width:3.5%;aspect-ratio:1;border-radius:50%;background:#ddd}
.rec.spin{animation:spin 3.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.arm{position:absolute;top:7%;right:7%;width:7px;height:58%;transform-origin:50% 8px;transform:rotate(-18deg);transition:transform .8s cubic-bezier(.3,.7,.2,1);pointer-events:none}
.arm::before{content:"";position:absolute;inset:0;border-radius:4px;background:linear-gradient(90deg,#ccc,#888)}
.arm::after{content:"";position:absolute;bottom:-10px;left:-6px;width:19px;height:26px;border-radius:4px;background:#222;border:1px solid #666}
.pivot{position:absolute;top:calc(7% - 14px);right:calc(7% - 14px);width:35px;height:35px;border-radius:50%;background:radial-gradient(circle,#999,#333);border:1px solid #666}
.np{text-align:center;width:100%}
.np h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np p{margin:4px 0 0;color:var(--mut);font-size:.9rem}
.bar{width:100%}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;background:var(--line);cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--fg)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--fg)}
.t{display:flex;justify-content:space-between;color:var(--mut);font-size:.75rem;margin-top:6px}
.row{display:flex;gap:10px;width:100%;align-items:center}
.row .play{width:56px;height:56px;border-radius:50%;background:var(--fg);color:var(--bg);border:0;font-size:1.2rem;flex:none}
.row input[type=range]{flex:1}
#msg{color:var(--mut);font-size:.82rem;text-align:center;min-height:1.2em;margin:0}
.crate{display:flex;gap:12px;overflow-x:auto;width:100%;padding:4px 2px 10px;scrollbar-width:thin}
.sl{flex:none;width:104px;touch-action:pan-x;user-select:none;-webkit-user-select:none;cursor:grab}
.sl b{display:block;width:104px;height:104px;border-radius:6px;background-size:cover;background-position:center;box-shadow:0 8px 18px #0008;pointer-events:none}
.sl span{display:block;font-size:.76rem;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.sl em{display:block;font-style:normal;font-size:.7rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.ghostrec{position:fixed;z-index:9;width:90px;height:90px;border-radius:50%;background-size:cover;pointer-events:none;box-shadow:0 12px 30px #000a;transform:translate(-50%,-50%)}
.s{display:flex;gap:8px;width:100%}
.s input{margin:0;flex:1}
</style>
</head>
<body>
<div id="bgc"></div>
<main>
  <section class="card" id="setup">
    <h2>Connect Spotify</h2>
    <p>One-time setup: create an app at <code>developer.spotify.com/dashboard</code>, tick “Web Playback SDK”, and add this exact Redirect URI:</p>
    <p><code id="ruri"></code></p>
    <p>Then paste the app’s Client ID (no secret needed):</p>
    <input type="text" id="cid" placeholder="Client ID" autocomplete="off">
    <button class="btn" id="login">Connect</button>
  </section>

  <section class="hide" id="player" style="width:100%;display:flex;flex-direction:column;gap:18px;align-items:center">
    <div class="deck" id="deck">
      <div class="platter" id="platter"><div class="rec" id="rec"><i id="lab"></i></div></div>
      <div class="pivot"></div><div class="arm" id="arm"></div>
    </div>
    <div class="np"><h2 id="ti">Pick a record</h2><p id="ar">Drag a sleeve onto the turntable</p></div>
    <div class="bar"><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek"><div class="t"><span id="cu">0:00</span><span id="du">0:00</span></div></div>
    <div class="row"><button class="play" id="pp" aria-label="Play or pause">▶</button><input type="range" id="vol" min="0" max="100" value="80" aria-label="Volume"></div>
    <p id="msg"></p>
    <div class="s"><input type="text" id="q" placeholder="Search songs or artists"><button class="btn" id="go">Search</button></div>
    <div class="crate" id="crate"></div>
    <button class="ghost" id="out">Disconnect</button>
  </section>
</main>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var SC='streaming user-read-email user-read-private user-modify-playback-state user-read-playback-state user-read-recently-played';
var RU=location.origin+location.pathname;
var S={tok:null,ref:null,exp:0,dev:null,pl:null,cur:null,playing:false,pos:0,dur:0,ts:0};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
function say(t){$('msg').textContent=t||''}
$('ruri').textContent=RU;$('cid').value=ls('cid')||'';
function b64(buf){return btoa(String.fromCharCode.apply(null,new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
async function login(){
  var id=$('cid').value.trim();if(!id){alert('Paste your Client ID first.');return}
  if(!window.crypto||!crypto.subtle){alert('Open this page from http://127.0.0.1 or an https site, not as a file.');return}
  ls('cid',id);
  var v=b64(crypto.getRandomValues(new Uint8Array(48)));ls('ver',v);
  var ch=b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
  location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({client_id:id,response_type:'code',redirect_uri:RU,scope:SC,code_challenge_method:'S256',code_challenge:ch});
}
async function tokenReq(body){
  var r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(body)});
  var j=await r.json();if(!j.access_token)throw new Error(j.error_description||'auth failed');
  S.tok=j.access_token;S.exp=Date.now()+j.expires_in*1000-30000;if(j.refresh_token){S.ref=j.refresh_token;ls('ref',S.ref)}
}
async function token(){
  if(S.tok&&Date.now()<S.exp)return S.tok;
  await tokenReq({client_id:ls('cid'),grant_type:'refresh_token',refresh_token:S.ref});return S.tok;
}
async function api(path,opt){
  var t=await token();opt=opt||{};opt.headers={Authorization:'Bearer '+t,'Content-Type':'application/json'};
  var r=await fetch('https://api.spotify.com/v1'+path,opt);
  if(r.status===204||r.status===202)return {};
  var j=await r.json().catch(function(){return {}});if(!r.ok)throw new Error((j.error&&j.error.message)||r.status);return j;
}
function fmt(ms){var s=Math.floor(ms/1000),m=Math.floor(s/60);s%=60;return m+':'+(s<10?'0':'')+s}
function norm(t){return {uri:t.uri,name:t.name,artist:t.artists.map(function(a){return a.name}).join(', '),img:(t.album.images[0]||{}).url||'',url:(t.external_urls||{}).spotify,dur:t.duration_ms}}
function crate(list){
  var c=$('crate');c.innerHTML='';
  if(!list.length){c.innerHTML='<p style="color:var(--mut);font-size:.85rem">Nothing here yet. Search for a song.</p>';return}
  list.forEach(function(t){
    var d=document.createElement('div');d.className='sl';
    var b=document.createElement('b');b.style.backgroundImage='url("'+t.img+'")';
    var n=document.createElement('span');n.textContent=t.name;var a=document.createElement('em');a.textContent=t.artist;
    d.appendChild(b);d.appendChild(n);d.appendChild(a);c.appendChild(d);drag(d,t);
  });
}
function drag(el,t){
  el.onpointerdown=function(e){
    var sx=e.clientX,sy=e.clientY,g=null;
    function over(x,y){var r=$('deck').getBoundingClientRect();return x>r.left&&x<r.right&&y>r.top&&y<r.bottom}
    function mv(e){
      if(!g&&Math.hypot(e.clientX-sx,e.clientY-sy)>8){g=document.createElement('div');g.className='ghostrec';g.style.backgroundImage='url("'+t.img+'")';document.body.appendChild(g)}
      if(g){g.style.left=e.clientX+'px';g.style.top=e.clientY+'px';$('deck').classList.toggle('over',over(e.clientX,e.clientY))}
    }
    function up(e){
      document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',cx);
      $('deck').classList.remove('over');
      if(g){g.remove();if(over(e.clientX,e.clientY))place(t)}else place(t);
    }
    function cx(){document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',cx);if(g)g.remove();$('deck').classList.remove('over')}
    document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);document.addEventListener('pointercancel',cx);
  };
}
function arm(p){$('arm').style.transform='rotate('+(p===null?-18:(20+p*14))+'deg)'}
async function place(t){
  S.cur=t;say('');
  arm(null);$('rec').classList.remove('in','spin');
  setTimeout(function(){
    $('lab').style.backgroundImage='url("'+t.img+'")';$('bgc').style.backgroundImage='url("'+t.img+'")';
    $('ti').textContent=t.name;$('ar').textContent=t.artist;$('du').textContent=fmt(t.dur);
    $('rec').classList.add('in');
  },450);
  setTimeout(function(){arm(0);$('rec').classList.add('spin')},1000);
  try{
    for(var i=0;i<40&&!S.dev;i++)await new Promise(function(r){setTimeout(r,250)});
    if(!S.dev)throw new Error('Player isn’t ready. Spotify Premium is required for in-page playback.');
    await api('/me/player/play?device_id='+S.dev,{method:'PUT',body:JSON.stringify({uris:[t.uri]})});
    S.playing=true;S.pos=0;S.dur=t.dur;S.ts=Date.now();
  }catch(e){say(e.message+(t.url?' You can still open it in Spotify.':''));arm(null);$('rec').classList.remove('spin')}
}
function toggle(){if(S.pl&&S.cur)S.pl.togglePlay();else $('q').focus()}
function sync(st){
  if(!st)return;
  S.playing=!st.paused;S.pos=st.position;S.dur=st.duration;S.ts=Date.now();
  $('rec').classList.toggle('spin',S.playing);$('pp').textContent=S.playing?'❚❚':'▶';
  if(!S.playing)arm(null);
}
setInterval(function(){
  if(!S.cur)return;
  var p=S.playing?Math.min(S.pos+(Date.now()-S.ts),S.dur):S.pos;
  $('cu').textContent=fmt(p);$('du').textContent=fmt(S.dur);
  if(S.dur){$('seek').value=p/S.dur*1000;if(S.playing)arm(p/S.dur)}
},300);
$('seek').oninput=function(e){if(S.pl&&S.dur)S.pl.seek(e.target.value/1000*S.dur)};
$('vol').oninput=function(e){if(S.pl)S.pl.setVolume(e.target.value/100)};
$('pp').onclick=toggle;$('platter').onclick=toggle;
function sdk(){
  window.onSpotifyWebPlaybackSDKReady=function(){
    var p=new Spotify.Player({name:'Turntable',getOAuthToken:function(cb){token().then(cb)},volume:.8});
    p.addListener('ready',function(d){S.dev=d.device_id});
    p.addListener('player_state_changed',sync);
    p.addListener('authentication_error',function(e){say('Auth error: '+e.message)});
    p.addListener('account_error',function(){say('Spotify Premium is required to play in the browser.')});
    p.addListener('initialization_error',function(e){say(e.message)});
    p.connect();S.pl=p;
  };
  var s=document.createElement('script');s.src='https://sdk.scdn.co/spotify-player.js';document.body.appendChild(s);
}
async function search(){
  var q=$('q').value.trim();if(!q)return;say('Searching…');
  try{var j=await api('/search?'+new URLSearchParams({q:q,type:'track',limit:10}));crate(j.tracks.items.map(norm));say('')}catch(e){say(e.message)}
}
$('go').onclick=search;$('q').onkeydown=function(e){if(e.key==='Enter')search()};
$('login').onclick=login;
$('out').onclick=function(){['ref','ver'].forEach(function(k){ls(k,null)});if(S.pl)S.pl.disconnect();location.href=RU};
async function start(){
  $('setup').classList.add('hide');$('player').classList.remove('hide');arm(null);crate([]);
  sdk();
  try{var j=await api('/me/player/recently-played?limit=20');var seen={},l=[];j.items.forEach(function(i){if(!seen[i.track.id]){seen[i.track.id]=1;l.push(norm(i.track))}});if(l.length)crate(l)}catch(e){say(e.message)}
}
(async function init(){
  var code=new URLSearchParams(location.search).get('code');
  try{
    if(code){await tokenReq({client_id:ls('cid'),grant_type:'authorization_code',code:code,redirect_uri:RU,code_verifier:ls('ver')});history.replaceState(null,'',RU);await start()}
    else if(ls('ref')){S.ref=ls('ref');await token();await start()}
  }catch(e){ls('ref',null);$('setup').classList.remove('hide');alert('Spotify login failed: '+e.message)}
})();
})();
</script>
</body>
</html>
