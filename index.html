<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turntable</title>
<style>
:root{--c:#8a7a66;box-sizing:border-box}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--c);transition:background .8s;font-family:"Courier New",ui-monospace,monospace;color:#fff}
#app{display:grid;grid-template-columns:1fr clamp(176px,30vw,340px);height:100dvh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.stage{position:relative;overflow:hidden}
.brand{position:absolute;left:20px;top:18px;font:800 15px "Helvetica Neue",Arial,sans-serif;letter-spacing:.5px;z-index:5}
.srch{position:absolute;left:20px;top:48px;z-index:5;display:flex;gap:6px}
.srch input{font:inherit;font-size:12px;width:150px;padding:6px 9px;border-radius:4px;border:1px solid #fff6;background:#0003;color:#fff}
.srch input::placeholder{color:#fffa}
.srch button,.btn{font:inherit;font-size:12px;color:#fff;background:#0005;border:1px solid #fff5;border-radius:4px;padding:6px 10px;cursor:pointer}
.vinyl{--d:min(112vh,130vw);position:absolute;width:var(--d);height:var(--d);left:calc(var(--d)*-.14);top:50%;transform:translateY(-50%);cursor:pointer}
.disc{position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle,#0d0d0d 0 2px,#1b1b1b 2px 4px);box-shadow:0 20px 60px #0007;animation:spin 3.4s linear infinite;animation-play-state:paused;transition:opacity .35s,transform .45s}
.disc::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,transparent 0,#fff1 8%,transparent 16%,transparent 50%,#fff1 58%,transparent 66%)}
.spin .disc{animation-play-state:running}
.swap .disc{opacity:0;transform:scale(.96)}
@keyframes spin{to{transform:rotate(360deg)}}
.lab{position:absolute;left:50%;top:50%;width:31%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden}
.lab svg{display:block;width:100%;height:100%}
.arm{position:absolute;left:73%;top:9%;height:50%;width:0;transform-origin:50% 0;transform:rotate(-14deg);transition:transform 1s cubic-bezier(.3,.7,.2,1);z-index:3;pointer-events:none}
.arm::before{content:"";position:absolute;left:-1px;top:0;width:3px;height:100%;background:#fff;border-radius:2px;box-shadow:0 2px 6px #0004}
.arm i{position:absolute;left:-10px;top:-10px;width:20px;height:20px;border-radius:50%;background:#fff}
.arm b{position:absolute;left:-8px;bottom:-8px;width:16px;height:22px;border-radius:3px;background:#e9e4da;box-shadow:0 2px 6px #0005}
.cov{position:absolute;right:22px;bottom:22px;width:clamp(86px,15vw,150px);aspect-ratio:1;background-size:cover;background-position:center;box-shadow:0 14px 30px #0006;border-radius:3px;opacity:0;z-index:4}
.cov.on{opacity:1;animation:drop .7s cubic-bezier(.2,.8,.2,1)}
@keyframes drop{from{transform:translateX(160%) rotate(10deg);opacity:0}to{transform:none;opacity:1}}
.wid{position:absolute;left:20px;bottom:20px;z-index:5;display:flex;align-items:center;gap:10px;background:#000a;border:1px solid #fff2;border-radius:10px;padding:8px 12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);max-width:calc(100% - 140px)}
.wid button{width:30px;height:30px;border-radius:50%;border:0;background:#fff;color:#111;cursor:pointer;font-size:12px;flex:none}
.wid input[type=range]{width:clamp(70px,14vw,170px)}
.wid small{font-size:10px;opacity:.8;min-width:62px}
input[type=range]{-webkit-appearance:none;appearance:none;height:3px;border-radius:3px;background:#fff4;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:#fff}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border:0;border-radius:50%;background:#fff}
.side{background:#e8e0d2;color:#222;display:flex;flex-direction:column;min-height:0;border-left:1px solid #0001}
.top{font-size:10px;letter-spacing:1px;text-align:right;padding:18px 16px 10px}
.top:before{content:"● ";color:#e0382e}
#msg{font-size:10px;color:#7a6f5d;padding:0 16px 8px;min-height:14px;line-height:1.3}
.list{flex:1;overflow-y:auto;padding:4px 14px 30px 18px;scrollbar-width:none}
.list::-webkit-scrollbar{display:none}
.sp{height:28px;margin-bottom:5px;border-radius:3px;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;cursor:pointer;transition:transform .25s;box-shadow:0 1px 0 #0003}
.sp.on{transform:translateX(-14px);box-shadow:0 3px 10px #0004}
.sp s{text-decoration:none;opacity:.7;font-weight:400;overflow:hidden;text-overflow:ellipsis}
.sp span{overflow:hidden;text-overflow:ellipsis;flex:none;max-width:62%}
.setup{position:fixed;inset:0;z-index:20;background:#000b;display:grid;place-items:center;padding:20px}
.setup div{max-width:420px;background:#1c1813;border:1px solid #fff2;border-radius:14px;padding:20px;font-family:"Helvetica Neue",Arial,sans-serif}
.setup h2{margin:0 0 8px}.setup p{font-size:.85rem;color:#c9bfae;line-height:1.5;margin:0 0 10px}
.setup code{background:#0007;padding:2px 6px;border-radius:5px;font-size:.78rem;word-break:break-all}
.setup input{width:100%;font:inherit;padding:10px;border-radius:8px;border:1px solid #fff3;background:#0006;color:#fff;margin:4px 0 12px}
.setup .go{background:#1db954;color:#04210f;border:0;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer}
.hide{display:none!important}
</style>
</head>
<body>
<div class="setup" id="setup">
  <div>
    <h2>Connect Spotify</h2>
    <p>One-time setup: create an app at <code>developer.spotify.com/dashboard</code>, tick “Web Playback SDK”, and add this exact Redirect URI:</p>
    <p><code id="ruri"></code></p>
    <p>Then paste the app’s Client ID (no secret needed):</p>
    <input id="cid" placeholder="Client ID" autocomplete="off">
    <button class="go" id="login">Connect</button>
  </div>
</div>
<div id="app">
  <section class="stage" id="stage">
    <div class="brand">TURNTABLE</div>
    <div class="srch"><input id="q" placeholder="Search songs"><button id="go">Go</button></div>
    <div class="vinyl" id="vinyl"><div class="disc"><div class="lab" id="lab"></div></div></div>
    <div class="arm" id="arm"><i></i><b></b></div>
    <div class="cov" id="cov"></div>
    <div class="wid"><button id="pp" aria-label="Play or pause">▶</button><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek"><small id="tm">0:00 / 0:00</small><input type="range" id="vol" min="0" max="100" value="80" style="width:50px" aria-label="Volume"></div>
  </section>
  <aside class="side">
    <div class="top" id="top">PICK A RECORD</div>
    <div id="msg"></div>
    <div class="list" id="list"></div>
  </aside>
</div>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var SC='streaming user-read-email user-read-private user-modify-playback-state user-read-playback-state user-read-recently-played';
var RU=location.origin+location.pathname;
var S={tok:null,ref:null,exp:0,dev:null,pl:null,cur:null,playing:false,pos:0,dur:0,ts:0};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
function say(t){$('msg').textContent=t||''}
$('ruri').textContent=RU;$('cid').value=ls('cid')||'';
function b64(buf){return btoa(String.fromCharCode.apply(null,new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
async function login(){
  var id=$('cid').value.trim();if(!id){alert('Paste your Client ID first.');return}
  if(!window.crypto||!crypto.subtle){alert('Open this page from http://127.0.0.1 or an https site, not as a file.');return}
  ls('cid',id);
  var v=b64(crypto.getRandomValues(new Uint8Array(48)));ls('ver',v);
  var ch=b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
  location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({client_id:id,response_type:'code',redirect_uri:RU,scope:SC,code_challenge_method:'S256',code_challenge:ch});
}
async function tokenReq(body){
  var r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(body)});
  var j=await r.json();if(!j.access_token)throw new Error(j.error_description||'auth failed');
  S.tok=j.access_token;S.exp=Date.now()+j.expires_in*1000-30000;if(j.refresh_token){S.ref=j.refresh_token;ls('ref',S.ref)}
}
async function token(){
  if(S.tok&&Date.now()<S.exp)return S.tok;
  await tokenReq({client_id:ls('cid'),grant_type:'refresh_token',refresh_token:S.ref});return S.tok;
}
async function api(path,opt){
  var t=await token();opt=opt||{};opt.headers={Authorization:'Bearer '+t,'Content-Type':'application/json'};
  var r=await fetch('https://api.spotify.com/v1'+path,opt);
  if(r.status===204||r.status===202)return {};
  var j=await r.json().catch(function(){return {}});if(!r.ok)throw new Error((j.error&&j.error.message)||r.status);return j;
}
function fmt(ms){var s=Math.floor(ms/1000),m=Math.floor(s/60);s%=60;return m+':'+(s<10?'0':'')+s}
function norm(t){return {uri:t.uri,name:t.name,artist:t.artists.map(function(a){return a.name}).join(', '),img:(t.album.images[0]||{}).url||'',url:(t.external_urls||{}).spotify,dur:t.duration_ms}}
/* colours */
var cache={};
function hash(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;var H=Math.abs(h)%360;return hsl(H,38,42)}
function hsl(h,s,l){s/=100;l/=100;var k=function(n){return (n+h/30)%12},a=s*Math.min(l,1-l),f=function(n){return Math.round(255*(l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)))))};return [f(0),f(8),f(4)]}
function rgb(c){return 'rgb('+c[0]+','+c[1]+','+c[2]+')'}
function lum(c){return (0.299*c[0]+0.587*c[1]+0.114*c[2])/255}
function color(t){
  if(cache[t.img])return Promise.resolve(cache[t.img]);
  return new Promise(function(res){
    var done=function(c){cache[t.img]=c;res(c)};
    if(!t.img)return done(hash(t.name));
    var im=new Image();im.crossOrigin='anonymous';
    im.onload=function(){try{
      var cv=document.createElement('canvas');cv.width=cv.height=16;var x=cv.getContext('2d');x.drawImage(im,0,0,16,16);
      var d=x.getImageData(0,0,16,16).data,r=0,g=0,b=0,w=0;
      for(var i=0;i<d.length;i+=4){var mx=Math.max(d[i],d[i+1],d[i+2]),mn=Math.min(d[i],d[i+1],d[i+2]),wt=0.15+(mx-mn)/255;r+=d[i]*wt;g+=d[i+1]*wt;b+=d[i+2]*wt;w+=wt}
      done([Math.round(r/w*.85),Math.round(g/w*.85),Math.round(b/w*.85)]);
    }catch(e){done(hash(t.name+t.artist))}};
    im.onerror=function(){done(hash(t.name+t.artist))};
    im.src=t.img;
  });
}
/* spines */
var tracks=[];
function spines(list){
  tracks=list;var L=$('list');L.innerHTML='';
  if(!list.length){var p=document.createElement('div');p.style.cssText='font-size:11px;color:#7a6f5d;padding:6px';p.textContent='Nothing yet. Search for a song.';L.appendChild(p);return}
  list.forEach(function(t,i){
    var d=document.createElement('div');d.className='sp';
    var c=hash(t.name+t.artist);d.style.background=rgb(c);d.style.color=lum(c)>.55?'#111':'#fff';
    var n=document.createElement('span');n.textContent=t.name;var a=document.createElement('s');a.textContent=t.artist;
    d.appendChild(n);d.appendChild(a);d.onclick=function(){place(t)};L.appendChild(d);t.el=d;
    color(t).then(function(c){d.style.background=rgb(c);d.style.color=lum(c)>.55?'#111':'#fff'});
  });
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function label(t,c){
  var lt=c.map(function(v){return Math.min(255,Math.round(v+(255-v)*.12))}),fg=lum(lt)>.6?'#1a1a1a':'#fff';
  var nm=t.name.length>24?t.name.slice(0,23)+'…':t.name,ar=t.artist.length>30?t.artist.slice(0,29)+'…':t.artist;
  $('lab').innerHTML='<svg viewBox="0 0 200 200"><defs><path id="pb" d="M 34 100 A 66 66 0 0 0 166 100"/><path id="pt" d="M 46 100 A 54 54 0 0 1 154 100"/></defs><circle cx="100" cy="100" r="100" fill="'+rgb(lt)+'"/><text fill="'+fg+'" font-family="Helvetica,Arial,sans-serif" font-weight="800" font-size="15" letter-spacing="2"><textPath href="#pb" startOffset="50%" text-anchor="middle">'+esc(nm.toUpperCase())+'</textPath></text><text fill="'+fg+'" opacity=".75" font-family="Courier New,monospace" font-size="9"><textPath href="#pt" startOffset="50%" text-anchor="middle">'+esc(ar.toUpperCase())+'</textPath></text><circle cx="100" cy="100" r="5" fill="#e8e0d2"/></svg>';
}
function arm(p){$('arm').style.transform='rotate('+(p===null?-14:(4+p*28))+'deg)'}
async function place(t){
  S.cur=t;say('');
  tracks.forEach(function(x){if(x.el)x.el.classList.toggle('on',x===t)});
  $('top').textContent='NOW SPINNING';
  arm(null);var v=$('vinyl');v.classList.remove('spin');v.classList.add('swap');
  var c=await color(t);
  setTimeout(function(){
    document.body.style.setProperty('--c',rgb(c));label(t,c);
    $('cov').classList.remove('on');void $('cov').offsetWidth;$('cov').style.backgroundImage='url("'+t.img+'")';$('cov').classList.add('on');
    v.classList.remove('swap');
  },450);
  setTimeout(function(){arm(0);v.classList.add('spin')},1100);
  try{
    for(var i=0;i<40&&!S.dev;i++)await new Promise(function(r){setTimeout(r,250)});
    if(!S.dev)throw new Error('Player isn’t ready. Spotify Premium is required for in-page playback.');
    await api('/me/player/play?device_id='+S.dev,{method:'PUT',body:JSON.stringify({uris:[t.uri]})});
    S.playing=true;S.pos=0;S.dur=t.dur;S.ts=Date.now();
  }catch(e){say(e.message);arm(null);v.classList.remove('spin')}
}
function toggle(){if(S.pl&&S.cur)S.pl.togglePlay();else $('q').focus()}
function sync(st){
  if(!st)return;
  S.playing=!st.paused;S.pos=st.position;S.dur=st.duration;S.ts=Date.now();
  $('vinyl').classList.toggle('spin',S.playing);$('pp').textContent=S.playing?'❚❚':'▶';
  if(!S.playing)arm(null);
}
setInterval(function(){
  if(!S.cur)return;
  var p=S.playing?Math.min(S.pos+(Date.now()-S.ts),S.dur):S.pos;
  $('tm').textContent=fmt(p)+' / '+fmt(S.dur);
  if(S.dur){$('seek').value=p/S.dur*1000;if(S.playing)arm(p/S.dur)}
},300);
$('seek').oninput=function(e){if(S.pl&&S.dur)S.pl.seek(e.target.value/1000*S.dur)};
$('vol').oninput=function(e){if(S.pl)S.pl.setVolume(e.target.value/100)};
$('pp').onclick=toggle;$('vinyl').onclick=toggle;
function sdk(){
  window.onSpotifyWebPlaybackSDKReady=function(){
    var p=new Spotify.Player({name:'Turntable',getOAuthToken:function(cb){token().then(cb)},volume:.8});
    p.addListener('ready',function(d){S.dev=d.device_id});
    p.addListener('player_state_changed',sync);
    p.addListener('authentication_error',function(e){say('Auth error: '+e.message)});
    p.addListener('account_error',function(){say('Spotify Premium is required to play in the browser.')});
    p.addListener('initialization_error',function(e){say(e.message)});
    p.connect();S.pl=p;
  };
  var s=document.createElement('script');s.src='https://sdk.scdn.co/spotify-player.js';document.body.appendChild(s);
}
async function search(){
  var q=$('q').value.trim();if(!q)return;say('Searching…');
  try{var j=await api('/search?'+new URLSearchParams({q:q,type:'track',limit:10}));spines(j.tracks.items.map(norm));say('')}catch(e){say(e.message)}
}
$('go').onclick=search;$('q').onkeydown=function(e){if(e.key==='Enter')search()};
$('login').onclick=login;
async function start(){
  $('setup').classList.add('hide');arm(null);spines([]);sdk();
  try{var j=await api('/me/player/recently-played?limit=20');var seen={},l=[];j.items.forEach(function(i){if(!seen[i.track.id]){seen[i.track.id]=1;l.push(norm(i.track))}});if(l.length)spines(l)}catch(e){say(e.message)}
}
(async function init(){
  var code=new URLSearchParams(location.search).get('code');
  try{
    if(code){await tokenReq({client_id:ls('cid'),grant_type:'authorization_code',code:code,redirect_uri:RU,code_verifier:ls('ver')});history.replaceState(null,'',RU);await start()}
    else if(ls('ref')){S.ref=ls('ref');await token();await start()}
  }catch(e){ls('ref',null);$('setup').classList.remove('hide');alert('Spotify login failed: '+e.message)}
})();
})();
</script>
</body>
</html>
